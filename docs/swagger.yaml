basePath: /api
definitions:
  dto.CreateCustomerRequest:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  dto.CreateOrderRequest:
    properties:
      customer_id:
        type: string
      notes:
        type: string
      pieces_count:
        minimum: 1
        type: integer
      service_type:
        type: string
      weight:
        type: number
    required:
    - customer_id
    - pieces_count
    - service_type
    - weight
    type: object
  dto.CreateServiceTypeRequest:
    properties:
      base_price:
        minimum: 0
        type: number
      description:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
      price_per_piece:
        minimum: 0
        type: number
      price_per_weight:
        minimum: 0
        type: number
    required:
    - name
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      estimated_cost:
        type: number
      estimated_time_minutes:
        type: number
      id:
        type: string
      notes:
        type: string
      pieces_count:
        type: integer
      ready_at:
        type: string
      service_type:
        type: string
      status:
        type: string
      weight:
        type: number
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      operator_key:
        description: opcional — si coincide → operador
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ServiceTypeResponse:
    properties:
      base_price:
        type: number
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price_per_piece:
        type: number
      price_per_weight:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para la gestión de ordenes y clientes.
  title: ITLAFINAL API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica a un usuario y devuelve un token JWT
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Inicio de sesión exitoso
      summary: Iniciar sesión
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Retorna los datos del usuario autenticado usando el JWT
      produces:
      - application/json
      responses:
        "200":
          description: Perfil obtenido con éxito
      security:
      - BearerAuth: []
      summary: Obtener perfil autenticado
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registra un nuevo usuario en la base de datos
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuario registrado con éxito
      summary: Registrar un usuario
      tags:
      - auth
  /customers:
    get:
      consumes:
      - application/json
      description: Recupera la lista de todos los clientes registrados
      produces:
      - application/json
      responses:
        "200":
          description: Lista de clientes obtenida con éxito
      security:
      - BearerAuth: []
      summary: Obtener todos los clientes
      tags:
      - customers
    post:
      consumes:
      - application/json
      description: Registra un nuevo cliente en la base de datos
      parameters:
      - description: Customer data
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cliente creado con éxito
      security:
      - BearerAuth: []
      summary: Crear un cliente
      tags:
      - customers
  /customers/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina un cliente específico utilizando su ID
      parameters:
      - description: ID del cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cliente eliminado con éxito
      security:
      - BearerAuth: []
      summary: Eliminar un cliente
      tags:
      - customers
    get:
      consumes:
      - application/json
      description: Recupera los detalles de un cliente específico utilizando su ID
      parameters:
      - description: ID del cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cliente obtenido con éxito
      security:
      - BearerAuth: []
      summary: Obtener un cliente por ID
      tags:
      - customers
  /orders:
    get:
      consumes:
      - application/json
      description: Recupera la lista de todas las órdenes registradas
      produces:
      - application/json
      responses:
        "200":
          description: Lista de órdenes obtenida con éxito
      security:
      - BearerAuth: []
      summary: Obtener todas las órdenes
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Registra una nueva orden en la base de datos
      parameters:
      - description: Order data
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Orden creada con éxito
      security:
      - BearerAuth: []
      summary: Crear una orden
      tags:
      - orders
  /orders/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina una orden existente de la base de datos
      parameters:
      - description: ID de la orden
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Orden eliminada con éxito
      security:
      - BearerAuth: []
      summary: Eliminar una orden
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Actualiza el estado de una orden existente
      parameters:
      - description: ID de la orden
        in: path
        name: id
        required: true
        type: string
      - description: Nuevo estado de la orden
        in: body
        name: status
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Estado actualizado con éxito
      security:
      - BearerAuth: []
      summary: Actualizar el estado de una orden
      tags:
      - orders
  /orders/mine:
    get:
      description: Devuelve únicamente las órdenes del cliente autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.OrderResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Obtener mis órdenes
      tags:
      - orders
  /service-types:
    get:
      consumes:
      - application/json
      description: Recupera la lista de todos los tipos de servicio registrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServiceTypeResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Obtener todos los tipos de servicio
      tags:
      - service-types
    post:
      consumes:
      - application/json
      description: Registra un nuevo tipo de servicio en la base de datos
      parameters:
      - description: Service type data
        in: body
        name: serviceType
        required: true
        schema:
          $ref: '#/definitions/dto.CreateServiceTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tipo de servicio creado con éxito
      security:
      - BearerAuth: []
      summary: Crear un tipo de servicio
      tags:
      - service-types
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina un usuario y su cliente asociado si existe
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Usuario eliminado con éxito
      summary: Eliminar un usuario
      tags:
      - auth
  /ws:
    get:
      description: Conexión autenticada para clientes. Envía STATUS_CHANGE y ORDER_READY;
        use Authorization Bearer o access_token.
      produces:
      - application/json
      responses:
        "101":
          description: Conexión WebSocket establecida
      security:
      - BearerAuth: []
      summary: WebSocket de notificaciones
      tags:
      - notifications
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
