services:
  postgres:
    image: postgres:16-alpine
    container_name: itla_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-development-password}
      POSTGRES_DB: ${POSTGRES_DB:-TimeGoBetter}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
